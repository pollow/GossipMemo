[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gossipmemo"
version = "0.1.0"
description = "A provenance-aware social memory server for agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
gossipmemo = "gossipmemo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gossipmemo", "src/gossipmemo_client"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
