[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gossipmemo"
version = "0.1.0"
description = "A provenance-aware social memory server for agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "sqlite-vec==0.1.9",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "autopep8>=2,<3",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
gossipmemo = "gossipmemo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gossipmemo", "src/gossipmemo_client"]

[tool.autopep8]
max_line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
