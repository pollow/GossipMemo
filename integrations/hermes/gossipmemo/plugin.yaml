name: gossipmemo
version: 0.3.0
description: "Provenance-aware social memory backed by an external GossipMemo server. Loads as a standalone Hermes plugin (plugins.enabled: [gossipmemo]) with real tool_search-deferrable tools."
author: Local
kind: standalone
provides_tools:
  - gossipmemo_query
  - gossipmemo_recall
  - gossipmemo_store
  - gossipmemo_dossier
  - gossipmemo_retract
  - gossipmemo_people
  - gossipmemo_guidance
  - gossipmemo_merge_people
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - on_session_finalize
