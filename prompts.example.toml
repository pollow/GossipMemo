# GossipMemo prompt overrides.
#
# Point GOSSIPMEMO_PROMPTS_PATH at a copy of this file to replace individual
# prompt fragments without editing code. Every key is a PromptLibrary field
# name; an absent key keeps the shipped default, and an unknown key is a
# startup error rather than a silent fallback. See
# src/gossipmemo/prompts/defaults.py for the shipped text of each field.

# The eight system prompts.
# extraction_system = """..."""
# person_reasoning_system = """..."""
# relationship_reasoning_system = """..."""
# user_model_reasoning_system = """..."""
# continuity_system = """..."""
# coverage_audit_system = """..."""
# goal_planning_system = """..."""
query_synthesis_system = """Answer the read-only question using the supplied
social-memory context. Return concise plain text only. Do not invent facts or
claim that anything was saved. Answer in the language of the question.
"""

# The memoir/persona method scan that goal planning reads.
# coverage_method = """..."""

# The two owner-reasoning stage fragments.
# projection_stage = "..."
# actions_stage = "..."

# The instruction paragraphs the prompt builders assemble around rendered data.
# Only the prose is configurable: which messages count as evidence, how a
# memory is serialized, and the section scaffolding stay in code.
#
# Two of them interpolate the configured user name and must keep their
# placeholder: `$quoted_user_name` expands to the quoted name ('Deus'),
# `$user_name` to the bare name (Deus). Using another `$name`, or dropping the
# one a fragment declares, is a startup error rather than a runtime failure in
# a background reasoner; write `$$` for a literal dollar sign. Fragments not
# listed here take no placeholders and are used verbatim.

# extraction_retention_rule = "..."
# extraction_user_evidence_rule = """The fixed current user is named $quoted_user_name. ..."""
# extraction_person_identity_rule = """... about $user_name; $user_name must never appear ..."""
# extraction_time_bound_rule = "..."
# extraction_known_people_rule = "..."
# extraction_comparison_rule = "..."
# extraction_clarification_rule = "..."
# owner_evidence_scope_rule = "..."
# owner_evidence_digest_rule = "..."
# continuity_rebuild_rule = "..."
# coverage_audit_folding_rule = "..."
# coverage_audit_entry_shape_rule = "..."
# goal_candidate_expansion_rule = "..."
# goal_candidate_closure_rule = "..."
# goal_reconciliation_merge_rule = "..."
# goal_reconciliation_lifecycle_rule = "..."
# goal_candidate_reduction_rule = "..."

# The per-root tables merge per root: naming M1 leaves M2..P11 at their
# defaults, and an unknown root id is an error.
[coverage_root_viewpoints]
M1 = "Which eras, beginnings, moves, endings, and chapters are legible?"

[coverage_root_blind_spots]
M1 = "childhood, family origin, education, work, migration, chapters still ahead"
